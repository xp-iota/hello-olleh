# dsh-lab 的根配置：空入口表。
#
# 所有行都由同目录的 cordis.patch.yml 以一次 insert 挂载（与官方 sdk-minimal
# profile 的写法一致）。这样做的原因：
#
#   * 根文件保持"零行"，patch 文件是唯一的装配清单，读者只需要看一个文件；
#   * dsh-app-boot 的 boot() 会把 patch 层应用到根表上，行 id 稳定，可用
#     `- id: xxx` 形式就地改配置（本工程 M12 演示的装配覆盖机制）。
#
# 加载顺序：boot('dsh-lab', <本文件>, [cordis.patch.yml]) →
#   Loader 载入本文件（空表）→ 应用 patch 层（insert 全部行）。
