# dsh-lab 装配清单（cordis.patch.yml）
#
# 这是本工程唯一的装配来源：一个顶层 YAML 数组，内含一条 `insert`，一次性挂载
# 全部 cordis 行。由 `src/boot.ts` 调用官方 `boot()` 应用，语义与 DSH 自带
# profile（cordis.yml 空表 + cordis.patch.yml 层）完全一致。
#
# 三类行：
#   1. 官方服务行 —— 名字是 @deepseek-ai/dsh-* 包，配置尽量沿用 dsh-base 的
#      取值，保证行为与官方 CLI 一致（沙箱、审批、压缩、spill 等）。
#   2. 本工程的教学 provider 行 —— 只有一条：anthropic-compat（M03），把旧
#      dsh-example 里的 AnthropicCompatAdapter 移植到 0.2.1 的 LlmAdapter API。
#   3. 可选能力行 —— 通过 `disabled: !!js ...` 或环境变量开关，默认全部开启。
#
# 与 dsh-base 刻意不同的地方（都是"去掉冗余"）：
#   * 不挂 profile 专属行：plugin-manager、hmr、config-editor、settings、
#     api-gateway/typert/remote-access、otel 遥测。这些是桌面/Web 产品外壳，
#     与 12 个能力模块的教学目标无关，而且都需要 profileContext 才可用。
#   * 不挂 web 搜索的 DeepSeek 检索后端之外的额外 provider。
#   * agent-loop 的 agents 保持空表：agent 由 CLI（REPL）在运行时按需创建，
#     这正是官方 headless/profile 的做法。
#
# 行 id 稳定，可被后续 patch 层就地覆盖（M12 演示）。

- insert:
    # ── 基础设施 ────────────────────────────────────────────────────────────
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # ── M03：模型接入层 ────────────────────────────────────────────────────
    - id: llm
      name: '@deepseek-ai/dsh-llm'

    # 重试策略：把 provider 的失败分类成可重试/不可重试，并做指数退避。
    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    # 本工程的示例 provider：Anthropic Messages 兼容适配器（M03 的主角）。
    # 路由名 anthropic-compat；MiniMax / Fuyao 等 Anthropic 兼容网关走这里。
    - id: llm-anthropic-compat
      name: './src/llm/anthropic-compat/index.ts'

    # 官方 DeepSeek 原生路由（设置 DEEPSEEK_API_KEY 即可用；缺 key 时调用期报错）。
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'

    # Agent 默认走到哪条路由。默认指向本工程的 anthropic-compat，
    # 可用 DSH_MODEL_PROVIDER / DSH_MODEL 覆盖（例如切到 deepseek-official）。
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: !!js "process.env.DSH_MODEL_PROVIDER ?? 'anthropic-compat'"
        model: !!js "process.env.DSH_MODEL ?? process.env.LLM_MODEL ?? 'MiniMax-M3'"

    # ── 会话核心（M04/M05 的数据底座）──────────────────────────────────────
    - id: session
      name: '@deepseek-ai/dsh-session'

    # 会话日志的官方 v4 编解码（tool/call、assistant/attempt 等事件序列化）。
    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    # session-log-deepseek 依赖的 DeepSeek 专有扩展字段（它注入
    # deepseekLlmApiExtensions；缺这一行，日志编解码行会永远 pending）。
    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    # 投影注册表：turnBoundary / inbox / todo / userQuestions 等都挂在它上面。
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    # 会话标题：首条人类消息的规则回退 + 模型摘要（LLM 失败不影响主流程）。
    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 4096
        timeoutMs: 60000

    # trajectory 的落盘：每会话一份 JSONL，根目录在本工程 .dsh-home/sessions。
    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # trajectory 的读取：ctx.sessionQuery（精确读、标题、lineage）。
    # openAt: never = 不落 SQLite、不做全文索引；精确读照常可用。
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # 会话统计与 turn 大纲：traj 视图的汇总列与"按 turn 跳转"数据源。
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # 模型请求前 / 顶层派发前的持久化检查点。
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    # ── 存储栈（M11：设置/附件/凭据之外的结构化持久化）──────────────────────
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # 投影缓存：列表页的 projection 列不必回放整条日志。
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # 跨会话引用（M11）：把另一条会话的快照按预算放进当前上下文。
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # ── Agent 循环（M04 的主角）────────────────────────────────────────────
    - id: agent
      name: '@deepseek-ai/dsh-agent'

    # 配置态 agent 保持空表：本工程的 agent 全部由 CLI 运行时创建。
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # ── 上下文工程（M02）──────────────────────────────────────────────────
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: !!js "process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent powered by the dsh-lab harness. Be concise and concrete.'"
        includeHarnessIdentity: true
        includeRuntimeContext: false

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # 工具结果裁剪：超大结果先截断再进入下一次请求（M02 的教学对象）。
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # 图片超预算时的降级：把最旧的图片换成占位符后重试。
    - id: image-offload
      name: '@deepseek-ai/dsh-compaction-image-offload'

    # 大输出溢写：超过内联预算的结果落到文件，模型只看到路径与摘要。
    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'

    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config:
        maxInlineTokens: 12500

    # 连续重复调用的提醒（同一工具 + 同一参数），M02 的上下文卫生示例。
    - id: repeat-tool-reminder
      name: '@deepseek-ai/dsh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # ── 工具运行时（M01）──────────────────────────────────────────────────
    - id: tools
      name: '@deepseek-ai/dsh-tools'

    # 工具调用超时策略：按工具名给不同预算，超时即取消。
    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    # ── 人机交互（M06）：审批 / 提问 / 斜杠命令 / 计划模式 / todo ──────────
    - id: user-approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    # 模型面向的提问工具：阻塞式（legacy），由 CLI 的 REPl 回答。
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
      config:
        mode: legacy

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    # 人类反馈：/feedback 命令 + 消息级反馈记录（都落进会话日志）。
    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 4096

    # 计划模式：只读探索 + exit_plan_mode 审批（M06 的第二个交互面）。
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval.

    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # 权限预设：read-only / workspace-write / danger-full-access 三档，
    # 与沙箱模式、审批策略联动（M07/M08 的教学对象之一）。
    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    # ── 文件与进程边界（M07）──────────────────────────────────────────────
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
        workspaceRoot: !!js "process.cwd()"

    # 一次性 shell 执行器：Windows 走 pwsh，其他平台走 bash。
    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js "process.platform === 'win32'"
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js "process.platform !== 'win32'"

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js "process.platform === 'win32'"

    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js "process.platform !== 'win32'"

    # 文件系统：fs-sandbox 把 fs-local 包在沙箱策略里（读/写都过边界）。
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'

    # 观察策略：写之前必须先读、编辑必须基于已读内容（M07 的教学对象）。
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'

    - id: tool-working-directory
      name: '@deepseek-ai/dsh-tool-working-directory'

    # ── 委派（M08）────────────────────────────────────────────────────────
    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # ── 长期运行（M09）────────────────────────────────────────────────────
    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'

    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'

    # 工作流编排：workflow 工具 + Node 侧 PTC 运行时（run_code 的宿主）。
    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # ── 外部能力接入（M10）────────────────────────────────────────────────
    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # 工作区指令文件（AGENTS.md 等）注入系统提示。
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    # MCP 资源读取侧；具体的 MCP server 实例由 M10 在运行时挂载。
    - id: mcp-resources
      name: '@deepseek-ai/dsh-mcp-resources'

    # 网络能力：匿名 fetch 默认开启；搜索需要 DEEPSEEK_API_KEY。
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    # ── 凭据与诊断（M11）─────────────────────────────────────────────────
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    - id: invariants
      name: '@deepseek-ai/dsh-invariants'
