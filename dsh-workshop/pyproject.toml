[project]
name = "dsh-workshop"
version = "0.1.0"
description = "OS-neutral orchestration for building the course decks, PPTX and MP4 through lusine-a-reves"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
workshop = "workshop.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
