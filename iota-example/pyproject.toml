[project]
name = "iota-example"
version = "0.1.0"
description = "Offline teaching examples aligned with dsh-example M01-M12"
requires-python = ">=3.11,<3.14"
dependencies = [
  "iota-core==2026.9.8",
]

[project.optional-dependencies]
# 真实模式（IOTA_PROVIDER=minimax）的运行依赖：ClaudeAdapter 通过它驱动内核进程。
# 离线教学入口不需要这一组，所以它是 optional 而不是主依赖。
real = [
  "claude-agent-sdk>=0.2,<1",
]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.15.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
files = [
  "runtime",
  "tests",
  "M01-tool-pipeline/lesson_m01.py",
  "M02-context-assembly-economics/lesson_m02.py",
  "M03-inference-service-access/lesson_m03.py",
  "M04-agent-loop-intervention/lesson_m04.py",
  "M05-session-surface/lesson_m05.py",
  "M06-human-in-the-loop/lesson_m06.py",
  "M07-execution-backends/lesson_m07.py",
  "M08-delegation-presets/lesson_m08.py",
  "M09-long-running-orchestration/lesson_m09.py",
  "M10-external-capabilities/lesson_m10.py",
  "M11-config-data-infrastructure/lesson_m11.py",
  "M12-framework-mechanisms/lesson_m12.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["iota_core.*", "iota_memory_protocol.*", "claude_agent_sdk.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[[tool.uv.index]]
name = "xp-nexus-pypi"
url = "http://nexus.logan.xiaopeng.local:8081/nexus/repository/pypi-hosted/simple/"
explicit = true

[tool.uv.sources]
iota-core = { path = "../../../codingx/petite/sources/iota-core", editable = true }
iota-memory-protocol = { index = "xp-nexus-pypi" }
iota-observability = { index = "xp-nexus-pypi" }
