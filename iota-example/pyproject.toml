[project]
name = "iota-example"
version = "0.1.0"
description = "Comparison examples aligned with dsh-example M01-M12, run against a real kernel"
requires-python = ">=3.11,<3.14"
dependencies = [
  "iota-core==2026.9.16",
]

[project.optional-dependencies]
# 默认内核：Hermes Direct 同进程直调，走 OpenAI 兼容协议（不需要 claude CLI）。
hermes = [
  "hermes-agent>=0.19.0",
]
# 对照内核：ClaudeAdapter 通过它驱动内核子进程（Anthropic 兼容网关）。
real = [
  "claude-agent-sdk>=0.2,<1",
]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.15.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 模块入口在导入 runtime/ 之前要先把工程根放进 sys.path，所以这里的 import 必然不在文件顶部。
"M[0-9][0-9]-*/run.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
# 共享层在这里检查；12 个模块目录名带连字符，不是合法包名，由 runtime/typecheck.sh
# 逐个检查（每次把模块目录设为顶层导入根，和运行时的 impl./scenes. 导入一致）。
files = ["runtime", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["iota_core.*", "iota_memory_protocol.*", "claude_agent_sdk.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[[tool.uv.index]]
name = "xp-nexus-pypi"
url = "http://nexus.logan.xiaopeng.local:8081/nexus/repository/pypi-hosted/simple/"
explicit = true

[tool.uv.sources]
iota-core = { path = "../../petite/sources/iota-core", editable = true }
iota-memory-protocol = { index = "xp-nexus-pypi" }
iota-observability = { index = "xp-nexus-pypi" }
