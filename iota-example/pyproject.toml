[project]
name = "iota-example"
version = "0.1.0"
description = "Offline teaching examples aligned with dsh-example M01-M12"
requires-python = ">=3.11,<3.14"
dependencies = [
  "iota-core==2026.9.8",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.15.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["runtime", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["iota_core.*", "iota_memory_protocol.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[[tool.uv.index]]
name = "xp-nexus-pypi"
url = "http://nexus.logan.xiaopeng.local:8081/nexus/repository/pypi-hosted/simple/"
explicit = true

[tool.uv.sources]
iota-core = { path = "../../../codingx/petite/sources/iota-core", editable = true }
iota-memory-protocol = { index = "xp-nexus-pypi" }
iota-observability = { index = "xp-nexus-pypi" }
